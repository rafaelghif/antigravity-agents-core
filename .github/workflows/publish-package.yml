name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Automated Test Suite
        run: npm test

  publish-npm:
    name: Publish to npm Registry
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish Package to npm
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          PUBLISHED_VER=$(npm view @rafaelghif/aac-core version 2>/dev/null || echo "")
          if [ "$CURRENT_VER" = "$PUBLISHED_VER" ]; then
            echo "Version $CURRENT_VER is already published to npm registry. Skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.TOKEN }}

  publish-gpr:
    name: Publish to GitHub Packages Registry
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rafaelghif'

      - name: Publish Package to GitHub Packages
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          PUBLISHED_VER=$(npm view @rafaelghif/aac-core version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")
          if [ "$CURRENT_VER" = "$PUBLISHED_VER" ]; then
            echo "Version $CURRENT_VER is already published to GitHub Packages. Skipping."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT || github.token }}
